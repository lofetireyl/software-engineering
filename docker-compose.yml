version: "3.9"

services:
  db:
    image: postgres:16
    container_name: social_app_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: social_app_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # This is how the app connects to the *db service* (not localhost!)
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/social_app
    ports:
      - "8000:8000"
    # Dev-only: bind-mount your code so changes are picked up without rebuilding
    volumes:
      - .:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  postgres_data:
